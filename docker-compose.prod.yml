services:
  postgres:
    image: postgres:16
    container_name: erp_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - erp_network

  minio:
    image: minio/minio
    container_name: erp_minio
    restart: always
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - erp_network

  backend:
    build: .
    container_name: erp_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - minio
    ports:
      - "4000:4000"
    networks:
      - erp_network

volumes:
  postgres_data:
  minio_data:

networks:
  erp_network: